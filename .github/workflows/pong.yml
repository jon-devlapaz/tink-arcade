name: Pong checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B -m tink_pong --help
      - run: python3 -B scripts/check_pong_tests.py
      - run: python3 -B scripts/check_pong_terminal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pong-terminal-${{ matrix.os }}
          path: runs/pong/04-test/output/terminal-transcript.txt
