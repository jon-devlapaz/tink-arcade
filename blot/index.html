<title>Blot · paper arcade</title>

<link rel="stylesheet" href="style.css">

<script src="ui.js" defer></script>

<body>
<main>
<header><span>SOCRATINK / PAPER ARCADE</span><span>01 / BLOT</span></header>
<h1>Blot</h1>
<p class="intro">A little ink. A whole page to touch.</p>
<div class="readout"><span id="count">0 / 6 words</span><span id="time">40.0 s of wet ink</span></div>
<div id="page" role="application" tabindex="0" aria-label="Blot playfield. Use arrow keys or WASD to steer. Touch every word before the ink dries.">
<div id="drop" aria-hidden="true"></div>
</div>
<p id="status" role="status">Touch every word before your ink dries.</p>
<div class="actions"><button id="pause">Pause</button><button id="restart">Fresh page</button></div>
<footer>Arrow keys / WASD to steer · P to pause · R to restart<br>Or hold a spot on the page to move toward it. Each word makes you bigger and slower.</footer>
</main>
</body>
</html>
